<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GST QR Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      max-width: 480px;
      margin-inline: auto;
      background: #fafafa;
    }
    h3 { margin: 0 0 12px; font-size: 17px; color: #222; }
    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      min-height: 260px;
    }
    #status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
    .info { background: #eef1f4; color: #333; }
    .ok   { background: #e6f4ea; color: #1e7e34; }
    .err  { background: #fdecea; color: #b3261e; }
    #retryBtn {
      display: none;
      margin-top: 10px;
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    #retryBtn:active { background: #1558b0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <h3>Scan GST e-Invoice QR Code</h3>
  <div id="reader"></div>
  <div id="status" class="info">Requesting camera access...</div>
  <button id="retryBtn">Retry Camera</button>

  <script>
  (function () {
    // ======================================================================
    // REQUIRED: paste your deployed Apps Script Web App /exec URL here.
    // Example: https://script.google.com/macros/s/AKfycbXXXXXXXXXXXXXXXXX/exec
    // ======================================================================
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMYok0hRCAavfIsIVHyOZJ45aqfH8Gnpu2OjgjvNP4nvelYaemWGoni8d8KtaG5sDJ/exec';

    var READER_ID = 'reader';
    var html5QrCode = null;
    var isProcessing = false;
    var lastWorkingSource = null;

    var statusEl = document.getElementById('status');
    var retryBtn = document.getElementById('retryBtn');

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls;
    }

    // Decodes the payload segment of a JWT/JWS. Signature is NOT verified.
    function decodeJwtPayload(token) {
      var parts = token.split('.');
      if (parts.length < 2) {
        throw new Error('Scanned text is not a JWT/JWS (no "." separators).');
      }
      var base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      var decoded = atob(base64);
      var jsonStr = decodeURIComponent(
        decoded.split('').map(function (c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join('')
      );
      return JSON.parse(jsonStr);
    }

    // Posts to Apps Script as text/plain on purpose — this keeps the
    // request a CORS "simple request" and avoids a preflight OPTIONS
    // call that Apps Script cannot answer.
    function postToAppsScript(payload) {
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) {
        return res.json();
      });
    }

var qrConfig = {
  fps: 10,
  qrbox: {
    width: 320,
    height: 320
  },
  aspectRatio: 1.0,
  disableFlip: true,
  experimentalFeatures: {
    useBarCodeDetectorIfSupported: false
  }
};

    function onScanSuccess(decodedText) {
    alert("Length = " + decodedText.length);  
      if (isProcessing) return;
      isProcessing = true;

      html5QrCode.pause(true);
      setStatus('QR captured — decoding...', 'info');

var payload;

decodedText = decodedText.trim();

try {
    payload = decodeJwtPayload(decodedText);
      } catch (err) {
        setStatus('Decode failed: ' + err.message, 'err');
        resumeAfterDelay();
        return;
      }

      setStatus('Saving to Sheet...', 'info');
      postToAppsScript(payload)
        .then(function (res) {
          if (res.status === 'success') {
            setStatus('Saved Successfully — row ' + res.row + '.', 'ok');
          } else {
            setStatus('Save failed: ' + (res.message || 'Unknown error'), 'err');
          }
          resumeAfterDelay();
        })
        .catch(function (err) {
          setStatus('Network error: ' + err.message, 'err');
          resumeAfterDelay();
        });
    }

    function resumeAfterDelay() {
      setTimeout(function () {
        isProcessing = false;
        try {
          html5QrCode.resume();
          setStatus('Point camera at next QR code.', 'info');
        } catch (e) {
          html5QrCode.stop().catch(function () {}).then(startScanner);
        }
      }, 1200);
    }

    function tryStart(cameraIdOrConfig) {
      return html5QrCode.start(cameraIdOrConfig, qrConfig, onScanSuccess, onScanFailure);
    }

    function startScanner() {
      retryBtn.style.display = 'none';
      setStatus('Starting camera...', 'info');
      isProcessing = false;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode(READER_ID, false);
      }

      if (lastWorkingSource) {
        tryStart(lastWorkingSource).catch(function () {
          lastWorkingSource = null;
          runDetectionChain();
        });
        return;
      }

      runDetectionChain();
    }

    function runDetectionChain() {
      var constraintAttempts = [
        { facingMode: { exact: 'environment' } },
        { facingMode: 'environment' }
      ];

      function tryNextConstraint(i) {
        if (i >= constraintAttempts.length) {
          fallbackToDeviceList();
          return;
        }
        tryStart(constraintAttempts[i]).then(function () {
          lastWorkingSource = constraintAttempts[i];
        }).catch(function () {
          tryNextConstraint(i + 1);
        });
      }

      tryNextConstraint(0);
    }

    function fallbackToDeviceList() {
      Html5Qrcode.getCameras().then(function (cameras) {
        if (!cameras || cameras.length === 0) {
          throw { name: 'NotFoundError', message: 'No camera devices found.' };
        }
        var rear = cameras.find(function (c) { return /back|rear|environment/i.test(c.label); });
        var chosen = rear || cameras[cameras.length - 1] || cameras[0];
        return tryStart(chosen.id).then(function () {
          lastWorkingSource = chosen.id;
        });
      }).catch(handleStartError);
    }

    function handleStartError(err) {
      var name = (err && err.name) || '';
      var msg;
      if (name === 'NotAllowedError') {
        msg = 'Camera permission denied. Allow camera access for this page in your browser settings, then retry.';
      } else if (name === 'NotFoundError') {
        msg = 'No camera found on this device.';
      } else if (name === 'NotReadableError') {
        msg = 'Camera is already in use by another app. Close it, then retry.';
      } else if (name === 'OverconstrainedError') {
        msg = 'Requested camera mode is not supported on this device.';
      } else {
        msg = 'Camera error: ' + (err && err.message ? err.message : err);
      }
      setStatus(msg, 'err');
      retryBtn.style.display = 'inline-block';
    }

    retryBtn.addEventListener('click', startScanner);
    window.addEventListener('load', startScanner);
  })();
  </script>
</body>
</html>
